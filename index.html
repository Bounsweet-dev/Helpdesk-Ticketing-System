<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Login | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>
    
    <div class="login-page">

        <!-- Left Side -->
        <div class="login-page-background">

            <div class="login-page-background-content">

                <i data-lucide="headset"></i>
                <h1>NexusDesk</h1>
                <p>IT Support Ticketing System</p>

            </div>

            <p class="login-creator">Built by Jeriemmy Doyog</p>

        </div>

        <!-- Right Side -->

        <div class="login-page-panel">

            <div class="login-container">

                <!-- Logo -->

                <div class="login-header">
                    <h2>Welcome Back</h2>
                    <p>Sign in to access the NexusDesk support platform.</p>
                </div>
                <form id="login-form">

                    <div class="login-field">

                        <label for="login-username">Username</label>
                        <input
                            type="text"
                            id="login-username"
                            placeholder="Enter your username"
                            required
                        >

                    </div>

                    <div class="login-field">

                        <label for="login-password">Password</label>

                        <div class="login-password">

                            <input
                                type="password"
                                id="login-password"
                                placeholder="Enter your password"
                                required
                            >

                            <button
                                type="button"
                                id="login-password-toggle"
                                aria-label="Show password"
                            ><i data-lucide="eye"></i></button>

                        </div>

                    </div>

                    <div class="login-options">

                        <label>
                            <input type="checkbox" id="login-remember">
                            Remember me
                        </label>

                        <a href="#" id="login-forgot-password">Forgot Password?</a>

                    </div>

                    <button type="submit" class="login-button">Login</button>

                    <p id="login-error" class="login-error">Invalid username or password.</p>

                </form>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
