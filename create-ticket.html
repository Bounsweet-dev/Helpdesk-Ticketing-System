<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Ticket | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>
    
    <div class="container">

        <!-- Side Bar -->

        <div class="sidebar">

            <div class="sidebar-header">

                <i data-lucide="headset" class="sidebar-logo"></i>

                <div class="sidebar-title">

                    <h1>NexusDesk</h1>
                    <h3>Support Platform</h3>

                </div>

            </div>

            <div class="sidebar-menu">

                <h4>Navigation</h4>
                <a href="dashboard.html">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard</a>
                <a href="create-ticket.html">
                    <i data-lucide="plus-circle"></i>
                    Create Ticket</a>
                <a href="ticket-list.html">
                    <i data-lucide="ticket"></i>
                    Ticket List</a>
                <a href="knowledge-base.html">
                    <i data-lucide="book"></i>
                    Knowledge Base</a>

            </div>

            <div class="sidebar-footer">

                <h2>Account</h2>
                <p>Account Email</p>

            </div>

        </div>


        <div class="main-content">

            <!-- Shared -->

            <div class="main-content-header">
                
                <h2><i data-lucide="plus-circle"></i>Create a Ticket</h2>

            </div>

            <div class="main-create-ticket">

                <!-- Create Ticket Main Title -->

                <div class="main-create-ticket-title">

                    <h1>Create Ticket</h1>
                    <p>Create a Support Ticket for a User</p>

                </div>

                <!-- Create Ticket Main Body -->

                <div class="main-create-ticket-body">

                    <div class="main-create-ticket-user-information">

                        <h2>User Information</h2>

                        <label for="user">User</label>
                        <div class="main-create-ticket-user-search">

                            <input
                                type="text"
                                id="user"
                                name="user"
                                placeholder="Search user..."
                                class="main-create-ticket-user-information-search-user"
                                autocomplete="off"
                            >

                            <div id="create-ticket-user-results" class="create-ticket-user-results"></div>

                        </div>

                        <label for="employee-number">Employee Number</label>
                        <input
                            type="text"
                            id="employee-number"
                            name="employee-number"
                            readonly
                        >

                        <label for="employee-email">Employee Email</label>
                        <input
                            type="email"
                            id="employee-email"
                            name="employee-email"
                            readonly
                        >

                        <label for="employee-job-title">Job Title</label>
                        <input
                            type="text"
                            id="employee-job-title"
                            name="employee-job-title"
                            readonly
                        >

                    </div>

                    <div class="main-create-ticket-ticket-information">

                        <h2>Ticket Information</h2>

                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="">Select Category</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                            <option value="network">Network</option>
                            <option value="account">Account</option>
                            <option value="other">Other</option>
                        </select>

                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="">Select Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>

                    </div>

                    <div class="main-create-ticket-subject-and-description">

                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter ticket subject"
                        >

                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter issue description..."
                        ></textarea>

                    </div>

                    <div class="main-create-ticket-buttons">

                        <button type="button" class="main-create-ticket-buttons-cancel">
                            <i data-lucide="x"></i>Cancel</button>
                        <button type="button" class="main-create-ticket-buttons-create">
                            <i data-lucide="circle-plus"></i>Create Ticket</button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>

</html>
