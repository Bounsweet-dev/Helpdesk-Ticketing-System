<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>
    
    <div class="forgot-password-page">

        <div class="forgot-password-content">

            <!-- Request Page -->

            <div class="forgot-password-request" id="forgot-password-request">

                <i data-lucide="key-round" class="forgot-password-icon"></i>

                <h1>Forgot Password?</h1>
                <p>Enter your NexusDesk username or email address.</p>

                <input
                    type="text"
                    id="forgot-password-identifier"
                    placeholder="Username or email"
                > <button
                    type="button"
                    id="forgot-password-submit">Request Password Reset
                </button>

            </div>

            <!-- Notification -->

            <div class="forgot-password-notification" id="forgot-password-notification">

                <i data-lucide="circle-check" class="forgot-password-success-icon"></i>

                <h2>Request submitted successfully</h2>

                <p>Your password reset request has been forwarded to the IT Support team.</p>

                <p>For immediate assistance, please call:
                    <strong>123-1234-5678</strong>
                </p>

            </div>

            <!-- Back to Login Screen -->

            <div class="forgot-password-back">
                <a href="index.html"><i data-lucide="arrow-left"></i>Back to Login</a>
            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
