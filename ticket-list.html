<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ticket List | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

    <div class="container">

        <!--Side Bar-->

        <div class="sidebar">

            <div class="sidebar-header">

                <i data-lucide="headset" class="sidebar-logo"></i>

                <div class="sidebar-title">

                    <h1>NexusDesk</h1>
                    <h3>Support Platform</h3>

                </div>

            </div>

            <div class="sidebar-menu">

                <h4>Navigation</h4>
                <a href="dashboard.html">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard</a>
                <a href="create-ticket.html">
                    <i data-lucide="plus-circle"></i>
                    Create Ticket</a>
                <a href="ticket-list.html">
                    <i data-lucide="ticket"></i>
                    Ticket List</a>
                <a href="knowledge-base.html">
                    <i data-lucide="book"></i>
                    Knowledge Base</a>

            </div>

            <div class="sidebar-footer">

                <div class="sidebar-account">

                    <div class="sidebar-account-information">

                        <h2 id="sidebar-account-name">Account</h2>
                        <p id="sidebar-account-email">Account Email</p>

                    </div>

                    <button
                        type="button"
                        class="sidebar-account-menu-button"
                        id="sidebar-account-menu-button"
                        aria-label="Account options"
                    ><i data-lucide="ellipsis-vertical"></i></button>

                </div>

                <div class="sidebar-account-menu" id="sidebar-account-menu">

                    <a href="about-page.html"><i data-lucide="info"></i>About</a>
                    <button
                        type="button"
                        id="sidebar-logout-button"
                    ><i data-lucide="log-out"></i>Log Out</button>

                </div>

            </div>

        </div>
        <!-- Shared -->

        <div class="main-content">

            <div class="main-content-header">

                <h2><i data-lucide="ticket"></i>Ticket List</h2>

            </div>

            <div class="main-ticket-list">

                <div class="main-ticket-list-title">

                    <h1>Ticket List</h1>
                    <p>List of all recorded IT tickets</p>

                </div>

                
                <!-- Filter Button -->

                <button type="button" id="main-ticket-list-filter-button"><i data-lucide="list-filter"></i>Filter Tickets</button>


                <!-- Filter -->

                <div class="main-ticket-list-filter collapsed" id="main-ticket-list-filter">

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-ticket-number">Ticket Number</label>
                        <input
                            type="text"
                            id="main-ticket-list-filter-ticket-number"
                            name="main-ticket-list-filter-ticket-number"
                        >

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-user">User</label>
                        <input
                            type="text"
                            id="main-ticket-list-filter-user"
                            name="main-ticket-list-filter-user"
                        >

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-department">Assigned Department</label>
                        <input
                            type="text"
                            id="main-ticket-list-filter-department"
                            name="main-ticket-list-filter-department"
                        >

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-technician">Assigned To</label>
                        <input
                            type="text"
                            id="main-ticket-list-filter-technician"
                            name="main-ticket-list-filter-technician"
                        >

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-priority">Priority</label>
                        <select id="main-ticket-list-filter-priority" name="priority">
                            <option value="">Select Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-status">Ticket Status</label>
                        <select id="ticket-status" name="ticket-status">
                            <option value="">Select Status</option>
                            <option value="open">Open</option>
                            <option value="in-progress">In progress</option>
                            <option value="on-hold">On Hold</option>
                            <option value="pending">Pending</option>
                            <option value="resolved">Resolved</option>
                        </select>

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-date">Date Created</label>
                        <input
                            type="date"
                            id="main-ticket-list-filter-date"
                            name="main-ticket-list-filter-date"
                        >

                    </div>

                    <div class="main-ticket-list-filter-item">

                        <label for="main-ticket-list-filter-category">Ticket Category</label>
                        <select id="main-ticket-list-filter-category" name="category">
                            <option value="">Select Category</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                            <option value="network">Network</option>
                            <option value="account">Account</option>
                            <option value="other">Other</option>
                        </select>

                    </div>

                    <!-- Filter Changes Buttons -->

                    <div class="main-ticket-list-filter-change">

                        <button type="button" id="main-ticket-list-filter-clear">
                            <i data-lucide="rotate-ccw"></i>Clear</button>
                        <button type="button" id="main-ticket-list-filter-apply">
                            <i data-lucide="check"></i>Apply Filters</button>

                    </div>

                </div>

                <div class="main-ticket-list-main-list">
                </div>

                <div class="main-ticket-list-count" id="main-ticket-list-count">
                    Showing 0 ticktets
                </div>

            </div>

        </div>

    </div>

    <!-- Script -->
    <script>lucide.createIcons()</script> <!-- Lucide Icons -->
    <script src="script.js"></script> <!-- Project Script -->

</body>
</html>
