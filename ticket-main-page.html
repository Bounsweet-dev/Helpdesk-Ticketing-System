<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Ticket Information | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>

    <div class="container">

        <!-- Sidebar -->

        <div class="sidebar">

            <div class="sidebar-header">

                <i data-lucide="headset" class="sidebar-logo"></i>

                <div class="sidebar-title">

                    <h1>NexusDesk</h1>
                    <h3>Support Platform</h3>

                </div>

            </div>

            <div class="sidebar-menu">

                <h4>Navigation</h4>
                <a href="dashboard.html">
                    <i data-lucide="layout-dashboard"></i>
                    Dashboard</a>
                <a href="create-ticket.html">
                    <i data-lucide="plus-circle"></i>
                    Create Ticket</a>
                <a href="ticket-list.html">
                    <i data-lucide="ticket"></i>
                    Ticket List</a>
                <a href="knowledge-base.html">
                    <i data-lucide="book"></i>
                    Knowledge Base</a>

            </div>

            <div class="sidebar-footer">

                <h2>Account</h2>
                <p>Account Email</p>

            </div>

        </div>

        <div class="main-content">

            <!-- Shared -->

            <div class="main-content-header">

                <h2><i data-lucide="pencil"></i>Ticket Information</h2>

            </div>

            <div class="main-ticket-information">

                <!-- Ticket Information Title -->

                <div class="main-ticket-information-title">

                    <h1>Ticket Information</h1>
                    <p>Manage Ticket Information</p>

                </div>

                <!-- Ticket Number -->

                <div class="main-ticket-information-ticket-number">

                    <label for="ticket-number">Ticket Number:</label>
                    <input
                    type="text"
                    id="ticket-number"
                    readonly
                    >

                </div>

                <!-- Ticket Information Body -->

                <div class="main-ticket-information-body">

                    <div class="main-ticket-information-user-information">

                        <h2>User Information</h2>

                        <label for="user">User</label>
                        <input
                            type="text"
                            id="user"
                            name="user"
                            readonly
                        >

                        <label for="employee-number">Employee Number</label>
                        <input
                            type="text"
                            id="employee-number"
                            name="employee-number"
                            readonly
                        >

                        <label for="employee-email">Employee Email</label>
                        <input
                            type="email"
                            id="employee-email"
                            name="employee-email"
                            readonly
                        >

                        <label for="employee-job-title">Job Title</label>
                        <input
                            type="text"
                            id="employee-job-title"
                            name="employee-job-title"
                            readonly
                        >

                    </div>

                    <div class="main-ticket-information-ticket-information">

                        <h2>Ticket Information</h2>

                        <label for="ticket-status">Status</label>
                        <select id="ticket-status" name="ticket-status">
                            <option value="open">Open</option>
                            <option value="in-progress">In progress</option>
                            <option value="on-hold">On Hold</option>
                            <option value="pending">Pending</option>
                            <option value="resolved">Resolved</option>
                        </select>

                        <label for="ticket-created-date">Opened On</label>
                        <input
                            type="text"
                            id="ticket-created-date"
                            name="ticket-created-date"
                            readonly
                        >

                        <label for="category">Category</label>
                        <select id="category" name="category">
                            <option value="">Select Category</option>
                            <option value="hardware">Hardware</option>
                            <option value="software">Software</option>
                            <option value="network">Network</option>
                            <option value="account">Account</option>
                            <option value="other">Other</option>
                        </select>

                        <label for="priority">Priority</label>
                        <select id="priority" name="priority">
                            <option value="">Select Priority</option>
                            <option value="low">Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>

                        <label for="assigned-department">Assigned Department</label>
                        <div class="main-ticket-information-assigned-search">

                            <input
                                type="text"
                                id="assigned-department"
                                name="assigned-department"
                                autocomplete="off"
                            >

                            <div
                                id="ticket-assigned-department-results"
                                class="ticket-assigned-search-results"
                            ></div>

                        </div>

                        <label for="assigned-technician">Assigned To</label>
                        <div class="main-ticket-information-assigned-search">

                            <input
                                type="text"
                                id="assigned-technician"
                                name="assigned-technician"
                                autocomplete="off"
                            >

                            <div
                                id="ticket-assigned-technician-results"
                                class="ticket-assigned-search-results"
                            ></div>

                        </div>

                    </div>

                    <div class="main-ticket-information-subject-and-description">

                        <label for="subject">Subject</label>
                        <input
                            type="text"
                            id="subject"
                            name="subject"
                            placeholder="Enter ticket subject..."
                        >

                        <label for="description">Description</label>
                        <textarea
                            id="description"
                            name="description"
                            placeholder="Enter issue description..."
                        ></textarea>

                    </div>

                    <div class="main-ticket-information-worknotes">

                        <label for="worknotes">Worknotes</label>

                        <textarea
                            id="worknotes"
                            name="worknotes"
                            placeholder="Enter troubleshooting done..."
                        ></textarea>

                        <div class="main-ticket-information-worknotes-buttons-publish">

                            <button
                                type="button"
                                id="main-ticket-information-worknotes-buttons-publish"
                            >
                                <i data-lucide="pencil"></i>
                                Publish Worknote
                            </button>

                        </div>

                        <div
                            id="main-ticket-information-worknotes-history"
                            class="main-ticket-information-worknotes-history"
                        ></div>

                    </div>

                    <div class="main-ticket-information-buttons">

                        <button type="button" id="main-ticket-information-buttons-cancel">
                            <i data-lucide="x"></i>Cancel</button>
                        <button type="button" id="main-ticket-information-buttons-save-changes">
                            <i data-lucide="pencil-line"></i>Save Changes</button>
                        <button type="button" id="main-ticket-information-buttons-resolve">
                            <i data-lucide="check"></i>Resolve</button>
                        <button type="button" id="main-ticket-information-buttons-reopen">
                            <i data-lucide="rotate-ccw"></i>Re-open Ticket</button>

                    </div>

                </div>

            </div>

        </div>

    </div>
    

    <!-- Script -->
    <script src="script.js"></script>

</body>
</html>
