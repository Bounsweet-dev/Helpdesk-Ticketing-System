<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Knowledge Base | NexusDesk</title>

    <link rel="icon" type="image/svg+xml" href="nexusdesk-favicon.svg">

    <link rel="stylesheet" href="style.css">

    <!-- Loading Inter Font Family -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Loading Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body>
    <div class="container">

        <!-- Side Bar -->

        <div class="sidebar">

            <div class="sidebar-header">

                <i data-lucide="headset" class="sidebar-logo"></i>

                <div class="sidebar-title">

                    <h1>NexusDesk</h1>
                    <h3>Support Platform</h3>

                </div>

            </div>

            <div class="sidebar-menu">

                <!-- Technician / Admin Sidebar -->

                <div id="technician-sidebar-navigation">

                    <h4>Navigation</h4>
                    <a href="dashboard.html">
                        <i data-lucide="layout-dashboard"></i>
                        Dashboard</a>
                    <a href="create-ticket.html">
                        <i data-lucide="plus-circle"></i>
                        Create Ticket</a>
                    <a href="ticket-list.html">
                        <i data-lucide="ticket"></i>
                        Ticket List</a>
                    <a href="knowledge-base.html">
                        <i data-lucide="book-open"></i>
                        Knowledge Base</a>

                </div>

                <!-- Employee Navigation -->

                <div id="employee-sidebar-navigation">

                    <h4>Navigation</h4>

                    <a href="user-help-request.html">
                        <i data-lucide="wrench"></i>
                        Ask for Assistance
                    </a>

                    <a href="knowledge-base.html">
                        <i data-lucide="book"></i>
                        Knowledge Base
                    </a>

                </div>

            </div>

            
            <div class="sidebar-footer">

                <div class="sidebar-account">

                    <div class="sidebar-account-information">

                        <h2 id="sidebar-account-name">Account</h2>
                        <p id="sidebar-account-email">Account Email</p>

                    </div>

                    <button
                        type="button"
                        class="sidebar-account-menu-button"
                        id="sidebar-account-menu-button"
                        aria-label="Account options"
                    ><i data-lucide="ellipsis-vertical"></i></button>

                </div>

                <div class="sidebar-account-menu" id="sidebar-account-menu">

                    <a href="about-page.html"><i data-lucide="info"></i>About</a>
                    <button
                        type="button"
                        id="sidebar-logout-button"
                    ><i data-lucide="log-out"></i>Log Out</button>

                </div>

            </div>
            
        </div>

        <div class="main-content">

            <!-- Shared -->

            <div class="main-content-header">

                <h2><i data-lucide="book-open-text"></i>Knowledge Base - Read an Article</h2>

            </div>

            <div class="main-knowledge-base-article-page">

                <!-- Knowledge Base Title -->

                <div class="main-knowledge-base-article-page-title">

                    <h1 id="knowledge-base-article-title"></h1>
                    <div class="main-knowledge-base-article-page-meta">

                        <span>

                            <i data-lucide="folder"></i>
                            <span id="knowledge-base-article-category"></span>

                        </span>

                        <span>

                            <i data-lucide="calendar"></i>
                            <span id="knowledge-base-article-date"></span>

                        </span>

                        <span>

                            <i data-lucide="clock"></i>
                            <span id="knowledge-base-article-read-time"></span>

                        </span>

                    </div>

                </div>

                <div class="main-knowledge-base-article-page-content" id="knowledge-base-article-content">
                </div>

                <a href="knowledge-base.html" class="knowledge-base-article-back">
                    <i data-lucide="arrow-left"></i>
                    Back
                </a>

                <div class="main-knowledge-base-article-page-related">

                    <h2>Related Articles</h2>

                    <div id="knowledge-base-related-articles">
                    </div>

                </div>

            </div>

        </div>

    </div>

    <!-- Script -->
    <script src="script.js"></script>

</body>

</html>
